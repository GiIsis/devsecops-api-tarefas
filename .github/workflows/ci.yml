name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.15.1'
          package-manager-cache: false

      - name: Instalar dependências
        run: npm ci --no-audit

      - name: Rodar os testes
        run: npm test

      - name: Instalar Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install semgrep==1.178.0

      - name: Analisar o código da API
        run: >-
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan
          --config p/javascript
          --config p/expressjs
          --metrics off
          --json-output semgrep.json
          index.js

      - name: Guardar relatório do Semgrep
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-semgrep
          path: semgrep.json
          if-no-files-found: error
        
      - name: Analisar dependências com npm audit
        run: |
          npm audit --json > npm-audit.json || test "$?" -eq 1
          node -e "const r = require('./npm-audit.json'); console.log('Total reportado:', r.metadata.vulnerabilities.total)"

      - name: Guardar relatório do npm audit
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-npm-audit
          path: npm-audit.json
          if-no-files-found: error

      - name: Executar análise passiva com ZAP
        run: |
          node index.js &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/tarefas > /dev/null

          relatorio="$RUNNER_TEMP/zap-out"
          mkdir -p "$relatorio"
          chmod a+w "$relatorio"

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/.github/zap-passivo.yml:/zap/wrk/zap-passivo.yml:ro" \
            -v "$relatorio:/zap/out" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap.sh -cmd -autorun /zap/wrk/zap-passivo.yml

      - name: Guardar relatório do ZAP
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-zap
          path: ${{ runner.temp }}/zap-out/*.json
          if-no-files-found: error