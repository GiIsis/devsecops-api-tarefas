name: Testes da API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.15.1'
          package-manager-cache: false

      - name: Instalar dependências
        run: npm ci --no-audit

      - name: Rodar os testes
        run: npm test

      - name: Instalar Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/python" -m pip install semgrep==1.178.0

      - name: Analisar o código da API
        run: >-
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan
          --config p/javascript
          --config p/expressjs
          --metrics off
          --json-output semgrep.json
          index.js

      - name: Guardar relatório do Semgrep
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-semgrep
          path: semgrep.json
          if-no-files-found: error